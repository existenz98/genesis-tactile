# ==========================================
# Runtime configuration (streaming pipeline)
# ==========================================


downscale: 1.0

sensor:

  type: stereo_dots        # mirror-stereo dots grid sensor

  params:
    # --- camera intrinsics ---
    img_wh: [640, 480]
    fx_px: 600.0
    fy_px: 600.0
    cx_px: 320.0
    cy_px: 240.0

    # --- camera pose in panel/world coords (z=0 plane, +Z outwards) ---
    cam_center_mm: [45.0, 0.0, 30.0]            # (x, y, z)
    cam_yaw_pitch_roll_deg: [-65.0, 0.0, 0.0]   # yaw, pitch, roll (world axes)

    # --- panel grid (dot lattice) ---
    panel_rows: 20
    panel_cols: 20
    panel_spacing_mm: 2.0
    dot_radius_mm: 0.5

    # --- mirrors (two planes) ---
    mirror1_center_mm: [-10.0, 0.0, 35.0]
    mirror1_yaw_pitch_roll_deg: [135.0, 0.0, 0.0]

    mirror2_center_mm: [15.0, 0.0, 50.0]
    mirror2_yaw_pitch_roll_deg: [165.0, 0.0, 0.0]

    # --- image split between the two mirror views ---
    split_mode: half            # fixed way of spliting the image as left = mirror1, right = mirror2
    split_seam_px: 0            # mask band around midline

    # --- dot detection ---
    detect_min_area_px: 6.0
    detect_max_area_px: 10000.0
    detect_min_circularity: 0.3

    # --- grid matching ---

    index_mode: track              # 'track' | 'robust'

    # robust mode parameters
    
    # track mode parameters
    match_gating_px: 14.0       # prepare(): predicted vs detected
    search_radius_px: 16.0      # process(): track from last frame

    # --- 3D triangulation ---
    triang_max_reproj_err_px: 20.0
    triang_min_angle_deg: 5.0


# ---------- DEBUG DISPLAY (OpenCV windows) ----------
display:
  enable: false
  show_seg_color: true       # show indexing overlays
  show_flow_color_raw: true  # show 2d displacement as dense color flow
