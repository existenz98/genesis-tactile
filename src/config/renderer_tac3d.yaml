camera:
  model: pinhole
  img_wh: [640, 480]
  z_ref_mm: 20.0
  z_cam_mm: 20.0

# Visible area in mm (mapped to full image at z_ref_mm)
view_mm: [40.0, 30.0]

surface:
  z_mm: 3.9    # reflective dot plane height (top surface of gel)
  translation_mm: [-10.0, 0.0, 0.0]   # Move surface 10 mm to the left along the X axis
  tilt:               # set to zero for no tilt
    rx_deg: 0.0       # rotation about world/camera X (x right)
    ry_deg: 30.0      # rotation about world/camera Y (y down)
    rz_deg: 0.0       # in-plane rotation about Z (z up)

mirror:
  enabled: true         # set true to enable mirror-based stereo
  plane_normal: [-1.0, 0.0, 0.0]          # vertical plane, normal along -X
  plane_point_mm: [17.0, 15.0, 0.0]       # mirror plane located left of camera center (camera at X=20, because view_mm[0]=40)

# Background and dot appearance
background_bgr: [60, 20, 20]    # dark bluish
dots:
  spacing_mm: 2.23               # grid spacing
  diameter_mm: 1.0              # physical printed dot diameter
  margin_mm: 0.8                # keepout from the viewbox edges
  color_bgr: [255, 230, 230]    # bright slightly bluish white

deformation:
  mode: none                    # "none" | "xdmf"
  xdmf_path: data/output/u.xdmf

# Optional oversampling for smoother circles (draw at x2 and downsample)
supersample: 2
