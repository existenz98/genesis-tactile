camera:
  model: pinhole
  img_wh: [640, 480]
  fx_px: 600.0
  fy_px: 600.0
  cx_px: 320.0
  cy_px: 240.0

  pose:             # camera pose in gel panel (world) coords
    x_mm:   45.0         # to the right of the panel
    y_mm:    0.0
    z_mm:   30.0         # higher than the panel
    # panel's coordinate is x in panel's width direction, y in height, z normal outwards
    # yaw about +Y, then pitch about +X, then roll about +Z (all in world axes).
    yaw_deg:   -65.0
    pitch_deg: 0.0
    roll_deg:  0.0

panel:
  rows: 20    # number of dot rows
  cols: 20    # number of dot columns
  spacing_mm: 2.0      # spacing between dots
  dot_radius_mm: 0.5   # radius of each dot


mirrors:                 # two mirrors.   default rotation only allow yaw
  - name: left
    center_mm: [ -10.0, 0.0, 35.0 ]
    # yaw about +Y, then pitch about +X, then roll about +Z (all in world axes).
    yaw_deg:   135.0
    pitch_deg: 0.0
    roll_deg:  0.0
  - name: right
    center_mm: [  15.0, 0.0, 50.0 ]
    # yaw about +Y, then pitch about +X, then roll about +Z (all in world axes).
    yaw_deg:   165.0
    pitch_deg: 0.0
    roll_deg:  0.0


appearance:
  background_bgr: [60, 20, 10]
  dot_color_bgr:  [250, 250, 255]
  ellipses: true                  # foreshortening-aware ellipses; false => circles

  supersample: 4        # 2 = render at 2× width height
  blur_sigma_px: 0.2    # Gaussian σ in supersampled pixels before downscale


surface:
  z_mm: 3.9      # check 'material.yaml' which describes the gel material.  it is 4mm thick, 4mm is the surface been touched.

deformation:
  mode: none             # "none" | "xdmf"
  xdmf_path: data/output/u.xdmf

