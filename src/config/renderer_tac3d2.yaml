camera:
  model: pinhole
  img_wh: [640, 480]
  fx_px: 180.0        # if Z=20mm, fx~160–190 keeps both views inside 640 px
  fy_px: 180.0
  cx_px: 320.0
  cy_px: 240.0

mirror:
  distance_mm: 5.0    # plane x = -5 mm (normal +X) → baseline B = 10 mm

panel:
  rows: 20
  cols: 20
  spacing_mm: 1.5
  dot_radius_mm: 0.3
  pose_rest:
    center_mm: [ 10.0, 0.0, 20.0 ]   # tx=+5 mm, ty=0, tz=20 mm
    yaw_deg: 30.0
    pitch_deg: 0.0
    roll_deg: 0.0

appearance:
  background_bgr: [60, 20, 10]
  dot_color_bgr:  [250, 250, 255]
  ellipses: true                  # foreshortening-aware ellipses; false => circles

  supersample: 2        # 2 = render at 2× width height
  blur_sigma_px: 1.0    # Gaussian σ in supersampled pixels before downscale


deformation:
  mode: none             # "none" | "xdmf"
  xdmf_path: data/output/u.xdmf
