
geometry:
  size_mm: [30.0, 20.0, 4.0]    # Gel layer's dimension [Lx, Ly, Lz] in mm.
  mesh_div: [60, 40, 16]        # FE grid divisions

material:
  poisson: 0.49
  layers:                       # z from top down (mm)
    - { z_min: 0.0, z_max: 2.0,  E_MPa: 0.2 }   # Young’s modulus in megapascals (MPa)
    - { z_min: 2.0, z_max: 3.0,  E_MPa: 0.6 }
    - { z_min: 3.0, z_max: 4.0,  E_MPa: 1.5 }

boundary:
  clamp_bottom: true
  clamp_sides: true

inverse:                        # iFEM regularization and constraints
  lambda_l2: 1e-2               # L2 regularization
  tv_weight: 0.0                # Total Variation (TV) regularization weight
  nonneg_tz: false              # normal force component, true means only compressive normal forces allowed, no “pulling”
  friction_mu: null             # friction coefficient for a friction cone constraint.
                                # enforces a physical relationship between shear and normal forces
                                # useful for realistic tangential force recovery.
